<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo de Sequência dos Olhos</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      image-rendering: pixelated;
    }

    body {
      width: 100vw;
      height: 100vh;
      backgroundColor: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Press Start 2P', monospace;
      color: #3233ff;
      overflow: hidden;
      background-color: #000;
    }

    .computer-container {
      position: relative;
      width: 80%;
      max-width: 1200px;
    }

    .computer-bg {
      width: 100%;
      height: auto;
      image-rendering: pixelated;
    }

    .game-screen {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      width: 600px;
      height: 500px;
      z-index: 1;
    }

    h1 {
      font-size: 16px;
      margin-bottom: 20px;
      text-align: center;
      text-shadow: 0 0 10px #3233ff;
    }

    .game-canvas {
      position: relative;
      width: 600px;
      height: 500px;
      border: 2px solid #3233ff;
      box-shadow: 0 0 20px #3233ff;
      background-color: #000;
      overflow: hidden;
    }

    .eye {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 80px;
      height: 80px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .eye.clicked {
      filter: brightness(1.5);
    }

    .eye-outer {
      width: 100%;
      height: 100%;
      border: 3px solid #3233ff;
      border-radius: 50%;
      background-color: #03002a;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 10px #3233ff;
    }

    .eye.clicked .eye-outer {
      box-shadow: 0 0 20px #3233ff;
      animation: pulse 0.5s;
    }

    .eye-pupil {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #3233ff;
      box-shadow: 0 0 10px #3233ff;
      position: relative;
    }

    .eye-shine {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #fff;
      position: absolute;
      top: 8px;
      left: 10px;
    }

    .sequence-number {
      position: absolute;
      top: -10px;
      right: -10px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background-color: #3233ff;
      color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 12px;
      font-weight: bold;
      border: 2px solid #000;
    }

    .progress-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
    }

    .progress-dot {
      width: 20px;
      height: 20px;
      border: 2px solid #3233ff;
      background-color: transparent;
    }

    .progress-dot.filled {
      background-color: #3233ff;
      box-shadow: 0 0 10px #3233ff;
    }

    .gif-container {
      position: relative;
      width: 600px;
      height: 500px;
    }

    .gif-container img {
      width: 100%;
      height: 100%;
      border: 2px solid #3233ff;
      box-shadow: 0 0 20px #3233ff;
      image-rendering: pixelated;
    }

    .buttons-container {
      margin-top: 20px;
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    button {
      padding: 12px 24px;
      background: transparent;
      border: 2px solid #3233ff;
      color: #3233ff;
      font-size: 12px;
      font-family: 'Press Start 2P', monospace;
      cursor: pointer;
      box-shadow: 0 0 8px #3233ff;
      transition: all 0.3s;
    }

    button:hover {
      background: #3233ff;
      color: #000;
    }

    button.primary {
      background: #3233ff;
      color: #000;
    }

    .hint-box {
      margin-top: 20px;
      padding: 15px;
      border: 2px solid #3233ff;
      background-color: #03002a;
      font-size: 10px;
      line-height: 1.8;
      text-align: center;
      box-shadow: 0 0 10px #3233ff;
    }

    .hidden {
      display: none;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
  </style>
</head>
