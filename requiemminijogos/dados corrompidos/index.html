<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dados corrompidos</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="arcade-container">
        
        <!-- Tela do jogo -->
        <div class="telajogo">
            <h1>Resolva o anagrama e siga para a próxima frase.</h1>
            <div class="container">
                <div class="caixa">
                    <div class="anagrama" id="anagrama">SOGARNFRETM</div>
                    <input type="text" id="resposta" placeholder="Digite a resposta">
                    <button id="verificarBtn" onclick="verificarResposta()">➜</button>
                </div>
                <div id="frase"></div>
            </div>
            
            <div>
                <button id="continueBtn">Pegar recompensa</button>
            </div>
        </div>

        <!-- Tela de recompensa (inicialmente escondida) -->
        <div id="recompensaScreen" class="recompensa-screen">
            <div class="recompensa-content">
                <div class="recompensa-text">Recompensa recebida</div>
                <img src="https://i.ibb.co/RkjVHybw/2-disco-rigido-danificado.png" alt="DiscoRigido" />
                <div class="recompensa-text">Leve até a placa mãe.</div>
                <button id="confirmBtn">ok</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
