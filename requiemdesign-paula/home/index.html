<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>REQUIEM</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- Container principal do fliperama -->
  <div class="arcade-container">
    
    <!-- Tela do jogo -->
    <div class="game-screen" id="gameScreen">
      
      <audio loop id="backgroundMusic">
        <source src="tema.wav" type="audio/wav">
      </audio>

      <button class="botao-imagem">
        <img src="https://i.ibb.co/KjWVrFkZ/placa.png" alt="Botão" />
      </button>

      <button class="botao">
        <img src="https://i.ibb.co/p6RNrrZL/btn2.png" alt="Botão" />
      </button>

      <button class="botao2">
        <img src="https://i.ibb.co/jPfNsDJx/btn.png" alt="Botão" />
      </button>

      <img src="https://i.ibb.co/0yFkzDRp/tv.png" alt="Personagem" class="imagem-flutuante" />
      
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
