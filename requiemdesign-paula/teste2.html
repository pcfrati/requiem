<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Botão Moldura Toggle</title>
<style>
  body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #fff;
  }

  .botao-moldura {
    position: relative;
    width: 120px;
    height: 120px;
    background: transparent;
    border: none;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .botao-moldura::before,
  .botao-moldura::after,
  .botao-moldura span::before,
  .botao-moldura span::after {
    content: "";
    position: absolute;
    width: 25px;
    height: 25px;
    border: 8px solid black;
    transition: all 0.3s ease;
  }

  /* Formato normal (para fora) */
  .botao-moldura::before {
    top: 0;
    left: 0;
    border-right: none;
    border-bottom: none;
  }
  .botao-moldura::after {
    top: 0;
    right: 0;
    border-left: none;
    border-bottom: none;
  }
  .botao-moldura span::before {
    bottom: 0;
    left: 0;
    border-top: none;
    border-right: none;
  }
  .botao-moldura span::after {
    bottom: 0;
    right: 0;
    border-top: none;
    border-left: none;
  }

  /* Estado "ativo" — cantos viram para dentro */
  .botao-moldura.ativo::before {
    top: 25%;
    left: 25%;
  }
  .botao-moldura.ativo::after {
    top: 25%;
    right: 25%;
  }
  .botao-moldura.ativo span::before {
    bottom: 25%;
    left: 25%;
  }
  .botao-moldura.ativo span::after {
    bottom: 25%;
    right: 25%;
  }
</style>
</head>
<body>
  <button class="botao-moldura" id="botao"><span></span></button>

  <script>
    const botao = document.getElementById('botao');
    botao.addEventListener('click', () => {
      botao.classList.toggle('ativo');
    });
  </script>
</body>
</html>
