<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>REQUIEM</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link href='https://fonts.googleapis.com/css?family=VT323' rel='stylesheet' type='text/css'>
  <link rel="stylesheet" href="teste.css" />
</head>
<body>

  <!-- Container principal do fliperama -->
  <div class="arcade-container">
    
    <!-- Tela do jogo -->
    <div class="game-screen" id="gameScreen">
      
      <div class="imagem-movel">
        <img src="https://i.ibb.co/9mDSssGb/placamae.png" alt="Imagem que se move">
      </div>
      
      <!-- Botões fixos na lateral direita -->
      <div class="botoes-lateral" id="botoes-lateral">
        <button id="botao-verde-lateral" title="Abrir menu"></button>
        <button id="botao-vermelho-lateral" title="Fechar menu"></button>
      </div>

      <!-- Menu lateral -->
      <div id="menu">
        <div class="botoes-menu">
          <button id="botao-verde-menu" title="Abrir menu"></button>
          <button id="botao-vermelho-menu" title="Fechar menu"></button>
        </div>
        
        <!-- Botões do menu -->
        <div class="menu-botoes-container">
          <div class="pixel2"></div>
          <div class="pixel2"></div>
          <div class="pixel2"></div>
          <div class="pixel2 imagem-botao">
            <img src="https://i.ibb.co/SXSr5L9D/painel.png" alt="Botão especial">
          </div>
        </div>
      </div>

      <button class="seta2">
        <img src="https://i.ibb.co/1Yd265Qn/seta.png" alt="Seta" />
      </button>

      <!-- Botão cruz -->
      <button class="botao-cruz" id="botaoCruz"><span></span></button>

    </div>
  </div>

  <script src="teste.js"></script>
</body>
</html>
