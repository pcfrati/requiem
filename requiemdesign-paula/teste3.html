<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Botão Moldura</title>
<style>
  body {
    background: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .botao-moldura {
    position: relative;
    width: 120px;
    height: 120px;
    background: transparent;
    border: none;
    cursor: pointer;
  }

  /* Cantos */
  .botao-moldura::before,
  .botao-moldura::after,
  .botao-moldura span::before,
  .botao-moldura span::after {
    content: "";
    position: absolute;
    width: 25px;
    height: 25px;
    background: transparent;
    border: 6px solid black;
  }

  /* Canto superior esquerdo */
  .botao-moldura::before {
    top: 0;
    left: 0;
    border-right: none;
    border-bottom: none;
  }

  /* Canto superior direito */
  .botao-moldura::after {
    top: 0;
    right: 0;
    border-left: none;
    border-bottom: none;
  }

  /* Canto inferior esquerdo */
  .botao-moldura span::before {
    bottom: 0;
    left: 0;
    border-top: none;
    border-right: none;
  }

  /* Canto inferior direito */
  .botao-moldura span::after {
    bottom: 0;
    right: 0;
    border-top: none;
    border-left: none;
  }

</style>
</head>
<body>
  <button class="botao-moldura"><span></span></button>
</body>
</html>
