<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>REQUIEM</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="teste.css" />
</head>

<body>
  <!-- Container principal do fliperama -->
  <div class="arcade-container">
    
    <!-- Tela do jogo -->
    <div class="game-screen" id="gameScreen">
      <img class="tela" src="television1.png" alt="Tela">
      
      <!-- Container do jogo Borrão -->
      <div id="gameScreen1" class="jogo-container">
        <h1>Revele a imagem</h1>
        <canvas id="gameCanvas" width="600" height="500"></canvas>

        <div class="slider-container">
          <input type="range" id="slider1" min="0" max="100" value="50">
        </div>
        <div class="slider-container">
          <input type="range" id="slider2" min="0" max="100" value="50">
        </div>
        
        <div>
          <button id="continueBtn">Pegar recompensa</button>
        </div>
      </div>

      <!-- Tela de recompensa -->
      <div id="recompensaScreen" class="jogo-container">
        <div class="recompensa-text">Recompensa recebida</div>
        <img src="requiemminijogos/borrao/img/bateria_litio.png" alt="Bateria de Lítio" />
        <div class="recompensa-text">Leve até a placa mãe.</div>
        <button id="confirmBtn">ok</button>
      </div>
      
    </div>
  </div>

  <script src="teste.js"></script>
</body>
</html>
